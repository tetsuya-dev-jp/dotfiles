name: Test chezmoi apply

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chezmoi-apply:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl git jq openssh-client sudo zsh

      - name: Install chezmoi
        run: |
          curl -sfL https://get.chezmoi.io | sh

      - name: Run chezmoi init
        run: |
          chezmoi init --source=.
          chezmoi verify

      - name: Run chezmoi apply
        run: |
          chezmoi apply --verbose

      - name: Verify files exist
        run: |
          files=(
            "$HOME/.zshrc"
            "$HOME/.gitconfig"
            "$HOME/.agents/AGENTS.md"
            "$HOME/.config/starship.toml"
            "$HOME/.config/zellij/config.kdl"
            "$HOME/.config/shell/.env.local.example"
            "$HOME/.config/git/ignore"
            "$HOME/.config/gh/config.yml"
            "$HOME/.config/mise/config.toml"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f not found"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Verify shell tool wiring
        run: |
          zsh -lic 'command -v eza >/dev/null'
          zsh -lic 'alias l | grep "eza"'
          zsh -lic 'alias ll | grep "eza -al"'
          git config --global --get-all credential.https://github.com.helper | grep '^!gh auth git-credential$'

      - name: Verify interactive setup skipped in CI
        run: |
          skipped_files=(
            "$HOME/.ssh/id_ed25519"
            "$HOME/.npmrc"
            "$HOME/.config/shell/.env.local"
            "$HOME/.config/gh/hosts.yml"
            "$HOME/.config/opencode/opencode.jsonc"
          )
          for f in "${skipped_files[@]}"; do
            if [ -f "$f" ]; then
              echo "FAIL: $f should not be created in CI"
              exit 1
            fi
            echo "OK: $f skipped"
          done

      - name: No plain-text secrets in source
        run: |
          git ls-files | while read -r f; do
            if grep -Pi '(BEGIN\s+OPENSSH\s+PRIVATE\s+KEY|gho_[a-zA-Z0-9]{36}|npm_[a-zA-Z0-9]{20,}|ctx7sk_[a-zA-Z0-9-]+)' "$f" 2>/dev/null; then
              echo "SECRET FOUND in $f"
              exit 1
            fi
          done
