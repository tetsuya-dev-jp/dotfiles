name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # shfmt
          SHFMT_VER=3.13.1
          curl -fsSLo /tmp/shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VER}/shfmt_v${SHFMT_VER}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          # actionlint
          ACTIONLINT_VER=1.7.12
          curl -fsSLo /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VER}/actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          rm /tmp/actionlint.tar.gz
          # markdownlint-cli2
          npm install -g markdownlint-cli2

      - name: Run shellcheck
        run: |
          shopt -s nullglob
          scripts=(run_*.sh)
          if [ ${#scripts[@]} -gt 0 ]; then
            shellcheck --severity=warning "${scripts[@]}"
          else
            echo "No shell scripts found."
          fi

      - name: Run shfmt
        run: |
          shopt -s nullglob
          scripts=(run_*.sh)
          if [ ${#scripts[@]} -gt 0 ]; then
            shfmt -i 2 -ci -d "${scripts[@]}"
          else
            echo "No shell scripts found."
          fi

      - name: Run actionlint
        run: actionlint

      - name: Run markdownlint
        run: markdownlint-cli2 "**/*.md" "!.git/"

  test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Pass GitHub token for mise
        run: echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"

      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git jq openssh-client sudo zsh xdg-utils

      - name: Install chezmoi
        run: |
          arch="$(dpkg --print-architecture)"
          chezmoi_version="2.70.2"
          curl -fsSLo /tmp/chezmoi.tar.gz \
            "https://github.com/twpayne/chezmoi/releases/download/v${chezmoi_version}/chezmoi_${chezmoi_version}_linux_${arch}.tar.gz"
          tar -xzf /tmp/chezmoi.tar.gz -C /usr/local/bin chezmoi
          rm /tmp/chezmoi.tar.gz

      - name: Run chezmoi apply
        run: |
          chezmoi apply --source="$PWD" --destination="$HOME" --force --no-tty --verbose

      - name: Run chezmoi verify
        run: |
          chezmoi verify --source="$PWD" --destination="$HOME"

      - name: Verify files exist
        run: |
          files=(
            "$HOME/.zshrc"
            "$HOME/.zshenv"
            "$HOME/.zprofile"
            "$HOME/.gitconfig"
            "$HOME/.agents/AGENTS.md"

            "$HOME/.config/opencode/opencode.jsonc"
            "$HOME/.config/opencode/package.json"
            "$HOME/.config/opencode/node_modules/@opencode-ai/plugin/package.json"
            "$HOME/.config/starship.toml"
            "$HOME/.config/mise/config.toml"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f not found"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Verify shell tool wiring
        run: |
          zsh -lic 'command -v eza >/dev/null'
          zsh -lic 'alias l | grep "eza"'
          zsh -lic 'alias ll | grep "eza -al"'
          zsh -lic 'print -r -- "$BROWSER" | grep -E "^(wslview|xdg-open)$"'
          git config --global --get-all credential.https://github.com.helper | grep '^!gh auth git-credential$'

      - name: Verify interactive setup skipped in CI
        run: |
          skipped_files=(
            "$HOME/.config/gh/hosts.yml"
          )
          for f in "${skipped_files[@]}"; do
            if [ -f "$f" ]; then
              echo "FAIL: $f should not be created in CI"
              exit 1
            fi
            echo "OK: $f skipped"
          done

      - name: No plain-text secrets in source
        run: |
          while IFS= read -r -d '' f; do
            if grep -Pi '(BEGIN\s+OPENSSH\s+PRIVATE\s+KEY|gho_[a-zA-Z0-9]{36}|npm_[a-zA-Z0-9]{20,}|ctx7sk[-_][a-zA-Z0-9-]+)' "$f" 2>/dev/null; then
              echo "SECRET FOUND in $f"
              exit 1
            fi
          done < <(find . -type f -not -path './.git/*' -print0)
