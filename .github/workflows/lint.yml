name: Lint shell scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sc_version="v0.10.0"
          base="https://github.com/koalaman/shellcheck/releases/download/${sc_version}"
          curl -sL "${base}/shellcheck-${sc_version#v}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-${sc_version#v}/shellcheck"

      - name: Run shellcheck
        run: |
          shopt -s nullglob
          scripts=(run_*.sh)
          if [ ${#scripts[@]} -gt 0 ]; then
            shellcheck --severity=warning "${scripts[@]}"
          else
            echo "No shell scripts found."
          fi
